name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/local-runtime-artifact

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Prepare standalone runtime
        if: github.ref == 'refs/heads/codex/local-runtime-artifact'
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          tar -C .next/standalone -czf /tmp/cubik-runtime.tgz .

      - name: Upload standalone runtime
        if: github.ref == 'refs/heads/codex/local-runtime-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: cubik-runtime
          path: /tmp/cubik-runtime.tgz
          compression-level: 0
          retention-days: 1
